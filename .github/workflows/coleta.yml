name: Coleta Semanal — Periferia Watch

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar scraper
        run: python scripts/scraper.py

      - name: Commitar dados atualizados
        run: |
          git config user.name  "Periferia Watch Bot"
          git config user.email "bot@periferia-watch"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "chore: atualiza dados $(date +'%Y-%m-%d')"
          git push
